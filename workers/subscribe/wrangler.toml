name = "wlcd-subscribe"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "wlcd-subscribers"
# Create with: npx wrangler d1 create wlcd-subscribers
# Then paste the database_id here and redeploy.
database_id = "0bc85b3d-2e64-485d-8952-20d2ffe1ba36"

[vars]
ALLOWED_ORIGINS = "https://what-llms-can-not-do.org,https://www.what-llms-can-not-do.org,https://what-llms-can-not-do.github.io,http://localhost:5173,http://127.0.0.1:5173"
SITE_ORIGIN = "https://what-llms-can-not-do.org"
# Confirm/unsubscribe links in emails (apex = same registrable domain as From).
API_ORIGIN = "https://what-llms-can-not-do.org"
# Public contact inbox (Email Routing → this worker's email handler). Also used as Reply-To.
CONTACT_EMAIL = "contact@what-llms-can-not-do.org"
# Cloudflare account for auto-registering Email Routing destinations when admins add emails.
CF_ACCOUNT_ID = "3f27c9f0b0c6a9fbfd9a0f36454a6bf1"

# Custom hostname for email links (same Cloudflare account as the zone).
[[routes]]
pattern = "subscribe.what-llms-can-not-do.org"
custom_domain = true

# Daily digest tick (UTC). Weekly = Mondays; monthly = 1st; yearly = Jan 1.
[triggers]
crons = ["0 15 * * *"]

# FROM_EMAIL — newsletter/transactional From, e.g. "WLCD Updates <updates@mail.what-llms-can-not-do.org>"
# Secrets (wrangler secret put):
#   RESEND_API_KEY
#   FROM_EMAIL      # updates@mail.… only (not contact@)
#   NOTIFY_SECRET
#   ADMIN_PASSWORD
#   TOKEN_SECRET
# Optional:
#   REPLY_TO        # fallback Reply-To when CONTACT_EMAIL is unset
#
# Contact fan-out (Email Routing):
#   1. Enable Email Routing on the zone (MX records)
#   2. Route CONTACT_EMAIL → Send to a Worker → wlcd-subscribe
#   3. Secret CF_API_TOKEN — Email Routing Addresses Edit (auto-register on /admin add)
#   4. Manage recipients on /admin; owners click Cloudflare’s verification email once
