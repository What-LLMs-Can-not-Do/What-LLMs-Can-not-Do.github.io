name: Notify subscribers

on:
  push:
    branches: [main]
    paths:
      - "public/data.csv"
  workflow_dispatch:
    inputs:
      before:
        description: Optional git SHA before the change (default HEAD^)
        required: false
        type: string
      after:
        description: Optional git SHA after the change (default HEAD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: notify-subscribers
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # Always run a job (avoid GitHub "No jobs were run" emails from a skipped-only workflow).
    steps:
      - name: Check subscribe notify config
        id: config
        env:
          SUBSCRIBE_API_URL: ${{ vars.SUBSCRIBE_API_URL }}
          SUBSCRIBE_NOTIFY_SECRET: ${{ secrets.SUBSCRIBE_NOTIFY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUBSCRIBE_API_URL:-}" ] || [ -z "${SUBSCRIBE_NOTIFY_SECRET:-}" ]; then
            echo "Subscribe notify is not fully configured (SUBSCRIBE_API_URL / SUBSCRIBE_NOTIFY_SECRET)."
            echo "Skipping send — set both in repo Settings → Secrets and variables."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "API=${SUBSCRIBE_API_URL%/}"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'
        with:
          fetch-depth: 0

      - name: Classify data.csv changes
        if: steps.config.outputs.configured == 'true'
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          AFTER="${{ inputs.after }}"
          BEFORE="${{ inputs.before }}"
          if [ -z "$AFTER" ]; then
            AFTER="${{ github.sha }}"
          fi
          if [ -z "$BEFORE" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$(git rev-parse "${AFTER}^")"
            fi
          fi
          echo "Comparing data.csv $BEFORE → $AFTER"
          python3 .github/scripts/classify_table_diff.py \
            --before "$BEFORE" \
            --after "$AFTER" \
            --pr-url "" \
            > /tmp/notify-events.json
          cat /tmp/notify-events.json

      - name: Send notify emails
        if: steps.config.outputs.configured == 'true'
        env:
          SUBSCRIBE_API_URL: ${{ vars.SUBSCRIBE_API_URL }}
          SUBSCRIBE_NOTIFY_SECRET: ${{ secrets.SUBSCRIBE_NOTIFY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          API="${SUBSCRIBE_API_URL%/}"
          echo "API=$API"
          echo "NOTIFY_SECRET length=${#SUBSCRIBE_NOTIFY_SECRET}"
          count="$(python3 -c 'import json; print(len(json.load(open("/tmp/notify-events.json"))["events"]))')"
          if [ "$count" = "0" ]; then
            echo "No titled-row additions/changes to notify about."
            exit 0
          fi
          echo "Sending $count event(s)…"
          # Use curl — Cloudflare blocks Python-urllib from Actions (error 1010).
          python3 -c 'import json; events=json.load(open("/tmp/notify-events.json"))["events"];
[open(f"/tmp/notify-event-{i}.json","w").write(json.dumps(e)) for i,e in enumerate(events)];
print(len(events))'
          for f in /tmp/notify-event-*.json; do
            echo "POST $f"
            cat "$f"
            echo
            http_code="$(curl -sS -o /tmp/notify-response.json -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-Notify-Secret: ${SUBSCRIBE_NOTIFY_SECRET}" \
              -H "User-Agent: wlcd-notify-subscribers/1.0" \
              --data-binary @"$f" \
              "${API}/notify")"
            echo "HTTP $http_code"
            cat /tmp/notify-response.json
            echo
            if [ "$http_code" != "200" ]; then
              if [ "$http_code" = "401" ]; then
                echo "::error::401 Unauthorized — SUBSCRIBE_NOTIFY_SECRET does not match worker NOTIFY_SECRET."
              elif [ "$http_code" = "403" ]; then
                echo "::error::403 from Cloudflare/worker — check bot protection / URL."
              fi
              exit 1
            fi
          done
