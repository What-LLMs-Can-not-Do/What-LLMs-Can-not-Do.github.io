name: Send news email

on:
  workflow_dispatch:
    inputs:
      subject:
        description: Email subject
        required: true
        type: string
      body:
        description: Plain-text email body
        required: true
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check subscribe news config
        id: config
        env:
          SUBSCRIBE_API_URL: ${{ vars.SUBSCRIBE_API_URL }}
          SUBSCRIBE_NOTIFY_SECRET: ${{ secrets.SUBSCRIBE_NOTIFY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUBSCRIBE_API_URL:-}" ] || [ -z "${SUBSCRIBE_NOTIFY_SECRET:-}" ]; then
            echo "Subscribe news is not fully configured (SUBSCRIBE_API_URL / SUBSCRIBE_NOTIFY_SECRET)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: POST /news
        if: steps.config.outputs.configured == 'true'
        env:
          SUBSCRIBE_API_URL: ${{ vars.SUBSCRIBE_API_URL }}
          SUBSCRIBE_NOTIFY_SECRET: ${{ secrets.SUBSCRIBE_NOTIFY_SECRET }}
          NEWS_SUBJECT: ${{ inputs.subject }}
          NEWS_BODY: ${{ inputs.body }}
        shell: bash
        run: |
          set -euo pipefail
          API="${SUBSCRIBE_API_URL%/}"
          python3 -c 'import json,os; open("/tmp/news-payload.json","w").write(json.dumps({"subject":os.environ["NEWS_SUBJECT"],"body":os.environ["NEWS_BODY"]}))'
          # Use curl — Cloudflare blocks Python-urllib from Actions (error 1010).
          http_code="$(curl -sS -o /tmp/news-response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Notify-Secret: ${SUBSCRIBE_NOTIFY_SECRET}" \
            -H "User-Agent: wlcd-send-news/1.0" \
            --data-binary @/tmp/news-payload.json \
            "${API}/news")"
          echo "HTTP $http_code"
          cat /tmp/news-response.json
          echo
          if [ "$http_code" != "200" ]; then
            exit 1
          fi
