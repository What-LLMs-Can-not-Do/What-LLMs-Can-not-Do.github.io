name: Contribution issue to PR

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: contribution-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  create-pr:
    if: >
      contains(github.event.issue.title, '[Table contribution]') ||
      contains(github.event.issue.title, '[Table change]') ||
      contains(join(github.event.issue.labels.*.name, ','), 'table-contribution')
    runs-on: ubuntu-latest
    steps:
      - name: Skip if PR already exists
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          EXISTING=$(gh pr list --state all --head "contribution/issue-${ISSUE_NUMBER}" --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - name: Ensure contribution label
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "table-contribution" \
            --description "Website form submission for the benchmark table" \
            --color "0E8A16" \
            --force || true
          gh issue edit "${{ github.event.issue.number }}" --add-label "table-contribution"

      - name: Parse contribution JSON
        if: steps.guard.outputs.skip != 'true'
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, ".github/scripts")
          from contribution import parse_contribution_json

          body = os.environ["ISSUE_BODY"]
          data = parse_contribution_json(body)
          contribution_type = data.get("contribution_type", "addition")
          pathlib.Path("/tmp/contribution.json").write_text(json.dumps(data), encoding="utf-8")
          pathlib.Path("/tmp/contribution_type.txt").write_text(contribution_type, encoding="utf-8")
          paper = (data.get("Paper title") or "submission").strip() or "submission"
          pathlib.Path("/tmp/paper_title.txt").write_text(paper, encoding="utf-8")
          row_id = str(data.get("ID", "")).strip()
          pathlib.Path("/tmp/row_id.txt").write_text(row_id, encoding="utf-8")
          PY

      - name: Download issue audio attachments
        if: steps.guard.outputs.skip != 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, ".github/scripts")
          from contribution import download_issue_attachments

          body = os.environ["ISSUE_BODY"]
          token = os.environ["GITHUB_TOKEN"]
          files = download_issue_attachments(body, token)
          pathlib.Path("/tmp/audio_files.json").write_text(json.dumps(files), encoding="utf-8")
          print(f"Found {len(files)} attachment(s)")
          PY

      - name: Write audio files
        if: steps.guard.outputs.skip != 'true'
        run: |
          AUDIO_FILES_JSON="$(cat /tmp/audio_files.json)"
          if [ "$AUDIO_FILES_JSON" = "[]" ]; then
            echo "No audio attachments found in issue body"
            exit 0
          fi
          export AUDIO_DIR=public/audio
          export AUDIO_FILES_JSON
          if [ "$(cat /tmp/contribution_type.txt)" = "change" ]; then
            export AUDIO_OVERWRITE=true
          fi
          python3 .github/scripts/contribution.py write-audio

      - name: Update or append CSV row
        if: steps.guard.outputs.skip != 'true'
        env:
          CSV_PATH: public/data.csv
        run: |
          export CSV_PATH
          export CONTRIBUTION_JSON="$(cat /tmp/contribution.json)"
          if [ "$(cat /tmp/contribution_type.txt)" = "change" ]; then
            python3 .github/scripts/contribution.py update-row
          else
            python3 .github/scripts/contribution.py append-row
          fi

      - name: Open pull request
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          BRANCH="contribution/issue-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/data.csv
          if [ -d public/audio ] && [ "$(find public/audio -type f ! -name '.gitkeep' | wc -l)" -gt 0 ]; then
            git add public/audio
          fi
          if [ "$(cat /tmp/contribution_type.txt)" = "change" ]; then
            git commit -m "Update table entry #$(cat /tmp/row_id.txt) from #${ISSUE_NUMBER}"
          else
            git commit -m "Add table contribution from #${ISSUE_NUMBER}"
          fi
          git push -u origin "$BRANCH"
          if [ "$(cat /tmp/contribution_type.txt)" = "change" ] && [ -s /tmp/row_id.txt ]; then
            PR_TITLE="Update table entry #$(cat /tmp/row_id.txt): $(cat /tmp/paper_title.txt)"
            PR_BODY="Automated PR from ${ISSUE_URL}.

          Please review the updated \`public/data.csv\` row and any audio files before merging."
          else
            PR_TITLE="Add table entry: $(cat /tmp/paper_title.txt)"
            PR_BODY="Automated PR from ${ISSUE_URL}.

          Please review the new \`public/data.csv\` row and any audio files before merging."
          fi
          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH")
          gh issue comment "$ISSUE_NUMBER" --body "Opened pull request for review: $PR_URL"
